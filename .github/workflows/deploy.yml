name: Validate

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-build-only-not-used-at-runtime
          NEXT_PUBLIC_SITE_URL: https://hotel-website-production-6ef6.up.railway.app
